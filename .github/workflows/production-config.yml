name: production configuration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: windows-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/prod.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements/prod.txt
      - name: Verify production secret
        shell: pwsh
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:OPENAI_API_KEY)) {
            throw "OPENAI_API_KEY is not configured in the production environment"
          }
          tripcompiler --help | Out-Null
          Write-Output "Production configuration is ready"