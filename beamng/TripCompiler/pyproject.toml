[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wrc-trip-compiler"
version = "0.1.0"
description = "Capture and analyze EA Sports WRC UDP telemetry."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [{ name = "AI Driving Instructor" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "pre-commit>=3.8,<5",
]

[project.scripts]
wrc-trip = "wrc_trip_compiler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wrc_trip_compiler = ["config/*.json"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
packages = ["wrc_trip_compiler"]
mypy_path = "src"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config --basetemp=.codex-pytest-tmp --cov=wrc_trip_compiler --cov-report=term-missing --cov-fail-under=75"
testpaths = ["tests"]

[tool.coverage.run]
source = ["wrc_trip_compiler"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 75
